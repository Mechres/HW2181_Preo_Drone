# Minimal generic Cortex-M0 SWD bring-up for the HW2181 SoC (not a known
# chip to OpenOCD, so no vendor target script exists -- this is a from
# -scratch generic config for a first connectivity test only).

adapter driver cmsis-dap
transport select swd
adapter speed 1000

set _CHIPNAME hw2181
swd newdap $_CHIPNAME cpu -expected-id 0x0bb11477 -ignore-version
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

init
halt
