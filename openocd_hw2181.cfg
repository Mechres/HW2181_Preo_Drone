# Minimal generic Cortex-M0 SWD bring-up for the HW2181 SoC (not a known
# chip to OpenOCD, so no vendor target script exists -- this is a from
# -scratch generic config for a first connectivity test only).

adapter driver cmsis-dap
transport select swd
adapter speed 1000

set _CHIPNAME hw2181
swd newdap $_CHIPNAME cpu -expected-id 0x0bb11477 -ignore-version
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# Hardware reset now wired: Pico GP1 -> drone RST (PB12/MRSTN, active low
# per the datasheet pinout). srst_only + srst_nogate: this probe only
# drives SRST (no separate TRST for SWD), and doesn't need to gate it
# against a running clock to be effective on this chip.
reset_config srst_only srst_nogate

init
# The combined "reset halt" command doesn't reliably catch this chip (times
# out waiting for halted) -- likely a reset-timing quirk specific to this
# part. A plain reset followed by a short settle and a separate halt works
# every time, so that's the pattern to use instead.
reset
sleep 300
halt
